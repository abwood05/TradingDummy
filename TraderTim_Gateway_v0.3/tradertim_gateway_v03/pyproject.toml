[project]
name = "tradertim-gateway"
version = "0.1.0"
description = "Safety gateway between an OpenAI trading agent and Robinhood Agentic Trading MCP"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
